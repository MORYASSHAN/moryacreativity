<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Shaan — Work</title>
    <meta name="description" content="A project by Shaan — live websites and concept landing pages, designed and coded by hand." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ece7df'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="back" href="index.html#gallery" data-nav><b>← Back</b><span>to all projects</span></a>

    <a class="badge" id="badge" href="#" aria-label="Open the site">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><path id="circ" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0" /></defs>
        <text><textPath href="#circ" id="badge-text" textLength="236" lengthAdjust="spacing">Visit the live site · Visit the live site ·</textPath></text>
      </svg>
      <span class="core"></span>
    </a>

    <div class="fade-top" aria-hidden="true"></div><div class="fade-bottom" aria-hidden="true"></div>
    <main class="page">
      <section class="cs-hero">
        <div class="bgimg" id="bgimg" aria-hidden="true"></div>
        <div class="cs-kicker" id="kicker"></div>
        <h1 class="cs-title" id="title"></h1>
        <p class="cs-line" id="line"></p>
        <button class="cs-more" id="more" aria-expanded="false" aria-controls="meta"><span class="plus" aria-hidden="true"></span>More info</button>
        <div class="cs-meta" id="meta">
          <div>
            <dl>
              <div><dt>Type</dt><dd id="m-type"></dd></div>
              <div><dt>Discipline</dt><dd id="m-role"></dd></div>
              <div><dt>Year</dt><dd id="m-year"></dd></div>
            </dl>
            <p id="m-about"></p>
          </div>
        </div>
      </section>

      <section class="stage-wrap" aria-label="Preview">
        <div class="stage" id="stage" data-cursor="Play" role="button" tabindex="0" aria-label="Load the interactive preview">
          <div class="poster" id="poster"></div>
          <div class="play"><i></i><span id="play-label">Play preview</span></div>
        </div>
        <div class="stage-bar"><span id="stage-note"></span><a id="open-full" class="link" href="#">Open full screen ↗</a></div>
      </section>

      <section class="chapters" aria-labelledby="ch-h">
        <h3 id="ch-h">Inside the experience</h3>
        <ol id="chapters"></ol>
      </section>

      <a class="next" id="next" href="#" data-nav data-cursor="Next">
        <div class="bg" id="next-bg" aria-hidden="true"></div>
        <div>
          <span class="lbl">Next project</span>
          <h4 id="next-title"></h4>
          <span class="k" id="next-kind"></span>
        </div>
      </a>
      <footer class="foot"><span>© 2026 Shaan · Moryasshan</span><span>Designed & coded by hand</span></footer>
    </main>

    <script type="module" src="work.js"></script>
  </body>
</html>
